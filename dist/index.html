<!DOCTYPE html><html><head><meta charset="UTF-8"><title>atoma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #30363d;border-radius:12px;margin:24px;padding:60px;transition:.3s;cursor:pointer;min-height:300px}
.dropzone.active{border-color:#58a6ff;background:#161b22}
.dropzone h1{font-size:2em;margin-bottom:8px}
.dropzone p{color:#8b949e;font-size:1.1em}
.results{display:none;padding:24px;overflow-y:auto}.results.show{display:block}
.header{margin-bottom:20px}.header h2{font-size:1.4em;color:#58a6ff}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.badge{background:#21262d;padding:6px 14px;border-radius:20px;font-size:.85em}
.section{margin:20px 0}.section h3{font-size:1.1em;margin-bottom:12px;color:#f0f6fc}
.seq{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin:16px 0;font-family:monospace;font-size:.9em;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px;text-align:center}
.card .v{font-size:1.5em;font-weight:bold}.card .l{font-size:.8em;color:#8b949e;margin-top:4px}
.ok{color:#3fb950}.warn{color:#d29922}.err{color:#f85149}
.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.9em;transition:.2s}
.btn:hover{background:#30363d;border-color:#58a6ff}
.terminal{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:12px;font-family:monospace;font-size:.8em;color:#58a6ff}
.terminal code{color:#c9d1d9;display:block;margin:4px 0}
.error{background:#3f1a1a;color:#f85149;padding:12px;border-radius:8px;margin:12px 0}
</style></head><body>

<div id="dropzone" class="dropzone" onclick="document.getElementById('fi').click()">
  <h1>atoma</h1>
  <p>Drop a molecular file here</p>
  <p style="font-size:.85em;margin-top:8px">.pdb · .sdf · .xyz · .cif · .mol</p>
  <p style="font-size:.75em;color:#484f58;margin-top:16px">click to browse</p>
</div>

<div id="results" class="results"><div id="content"></div></div>
<input type="file" id="fi" style="display:none" accept=".pdb,.sdf,.mol,.xyz,.cif">

<script type="module">
import { invoke } from './@tauri-apps/api/core.js';

var dz = document.getElementById('dropzone');
var rs = document.getElementById('results');
var fi = document.getElementById('fi');

dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('active'); });
dz.addEventListener('dragleave', function() { dz.classList.remove('active'); });
dz.addEventListener('drop', function(e) {
  e.preventDefault(); dz.classList.remove('active');
  var f = e.dataTransfer.files[0]; if (f) handle(f);
});
fi.addEventListener('change', function(e) {
  var f = e.target.files[0]; if (f) handle(f);
});

async function handle(file) {
  try {
    var text = await file.text();
    var d = await invoke('open_file', { content: text, filename: file.name });
    render(d, file.name);
  } catch(err) {
    dz.style.display='none'; rs.classList.add('show');
    document.getElementById('content').innerHTML =
      '<button class="btn" onclick="location.reload()">Back</button>'+
      '<div class="error"><b>Error:</b> '+esc(String(err))+'.<br>Try: <code>atoma view '+esc(file.name)+'</code></div>';
  }
}

function render(d, fn) {
  dz.style.display='none'; rs.classList.add('show');
  if (!d.ok) {
    document.getElementById('content').innerHTML =
      '<button class="btn" onclick="location.reload()">Back</button>'+
      '<div class="error"><b>Parse Error:</b> '+esc(d.error)+'<br>Try: <code>atoma view '+esc(fn)+'</code></div>';
    return;
  }
  var cc = d.clashes===0?'ok':(d.clashes<10?'warn':'err');
  var rc = d.rama_outliers===0?'ok':'warn';
  document.getElementById('content').innerHTML =
    '<button class="btn" onclick="location.reload()">Open another</button>'+
    '<div class="header"><h2>'+esc(d.name||fn)+'</h2></div>'+
    '<div class="badges">'+
      '<span class="badge">'+(d.format||'PDB')+'</span>'+
      '<span class="badge">'+d.atoms+' atoms</span>'+
      '<span class="badge">'+d.mw.toFixed(1)+' Da</span>'+
      (d.residues?'<span class="badge">'+d.residues+' residues</span>':'')+
      (d.chains?'<span class="badge">'+d.chains+' chains</span>':'')+
    '</div>'+
    '<div class="section"><h3>Quick Analysis</h3><div class="grid">'+
      '<div class="card"><div class="v '+(d.bonds>0?'ok':'')+'">'+d.bonds+'</div><div class="l">Bonds</div></div>'+
      '<div class="card"><div class="v '+cc+'">'+d.clashes+'</div><div class="l">Clashes</div></div>'+
      '<div class="card"><div class="v '+rc+'">'+d.rama_outliers+'</div><div class="l">Rama</div></div>'+
      '<div class="card"><div class="v">'+d.ss_helix+'H</div><div class="l">Helices</div></div>'+
      '<div class="card"><div class="v">'+(d.entropy||0).toFixed(1)+'</div><div class="l">Entropy</div></div>'+
    '</div></div>'+
    (d.sequence?'<div class="section"><h3>Sequence</h3><div class="seq">'+esc(d.sequence)+'</div></div>':'')+
    '<div class="terminal"><b>More in terminal:</b>'+
      '<code>atoma view '+esc(fn)+'</code>'+
      '<code>atoma analyze '+esc(fn)+'</code>'+
      '<code>atoma convert '+esc(fn)+' --to xyz</code>'+
    '</div>';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script></body></html>
