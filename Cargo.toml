[workspace]
members = [
    "crates/atoma-core",
    "crates/atoma-cli",
    "crates/atoma-app",
    "crates/atoma-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Dishant707/molio"
authors = ["Dishant"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
pretty_assertions = "1"
proptest = "1"

# Optimization for release builds
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
