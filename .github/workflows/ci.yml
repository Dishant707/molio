name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run integration tests
        run: cargo test --workspace --test '*'

      - name: Build release
        run: cargo build --release

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench -p molio-core -- --output-format bencher | tee benchmark_output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true

  cross_validate:
    name: Cross-validate vs Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python reference tools
        run: |
          pip install biopython

      - name: Run cross-validation
        run: |
          cargo run -p molio -- bench --file test_data/pdb/1crn.pdb
          python -c "
          from Bio.PDB import PDBParser
          import time
          t0 = time.time()
          for _ in range(100):
              p = PDBParser(QUIET=True)
              s = p.get_structure('1crn', 'test_data/pdb/1crn.pdb')
          t = time.time() - t0
          print(f'Biopython: {t*1000:.2f}ms per 100 parses ({t*10:.2f}ms avg)')
          print(f'Atoms: {sum(1 for _ in s.get_atoms())}')
          "

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
